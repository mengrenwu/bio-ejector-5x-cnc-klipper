[include mainsail.cfg]

# host MCU service is preinstalled and ready to use with:
#[mcu CB1]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_220020000651323235363233-if00





[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_220020000651323235363233-if00

[printer]
kinematics: cartesian_abc
kinematics_abc: cartesian_abc
axis: XYZAB
max_velocity: 600
max_accel: 3000
max_z_velocity: 100
max_z_accel: 200


[force_move]
enable_force_move: True

[gcode_macro SET_ORIGIN]
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0 E=0


# driver 0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 160
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC4            
run_current: 0.8
hold_current: 0.2
interpolate: true
stealthchop_threshold: 999999


# driver 1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 120
homing_speed: 50
[tmc2209 stepper_y]
uart_pin: PD11           
run_current: 0.8
hold_current: 0.2
interpolate: true
stealthchop_threshold: 999999



# driver 2
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0.5
position_max: 35.5
homing_speed: 5
[tmc2209 stepper_z]
uart_pin: PC6          
run_current: 0.8
hold_current: 0.2
interpolate: true
stealthchop_threshold: 999999



#[manual_stepper stepper_ab]


# driver 5
[stepper_a]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 40
endstop_pin: PG11
position_endstop: 0
position_max: 120
homing_speed: 50
[tmc2209 stepper_a]
uart_pin: PE4          
run_current: 0.6
hold_current: 0.2
interpolate: true
stealthchop_threshold: 999999

# driver 4
[stepper_b]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 40
endstop_pin: PG12
position_endstop: 0
position_max: 95
homing_speed: 50
[tmc2209 stepper_b]
uart_pin: PF2          
run_current: 0.8
hold_current: 0.2
interpolate: true
stealthchop_threshold: 999999


#[idle_timeout]
#timeout: 120 


[output_pin valve]
pin: PA8                # Fan0 pin (check your Octopus schematic!)
pwm: False              # Digital ON/OFF
value: 0                # OFF by default
shutdown_value: 0       # OFF on emergency stop


[output_pin f1]
pin: PD12
pwm: False
value: 0
shutdown_value: 0


[gcode_macro HOME_ALL_CUSTOM]
description: "Home XYAB first, then Z"
gcode:
    G28 x
    G28 y
    G28 a
    G28 b
    G28 z

[gcode_macro QUERY_ENDSTOP]
gcode:
    QUERY_ENDSTOPS

[gcode_macro HOME_A]
gcode:
    G28 a
[gcode_macro HOME_B]
gcode:
    G28 b



[gcode_macro A_PLUS_0]
gcode:
    G91
    G1 a0.1
    G90

[gcode_macro A_MINUS_0]
gcode:
    G91
    G1 a-0.1 
    G90

[gcode_macro A_PLUS_1]
gcode:
    G91
    G1 a1 F3000
    G90

[gcode_macro A_MINUS_1]
gcode:
    G91
    G1 a-1 F3000
    G90

[gcode_macro A_PLUS_10]
gcode:
    G91
    G1 a10 F3000
    G90

[gcode_macro A_MINUS_10]
gcode:
    G91
    G1 a-10 F3000
    G90

[gcode_macro HOME_B]
gcode:
    G28 b

[gcode_macro B_PLUS_0]
gcode:
    G91
    G1 b0.1 
    G90

[gcode_macro B_MINUS_0]
gcode:
    G91
    G1 b-0.1 
    G90
[gcode_macro B_PLUS_1]
gcode:
    G91
    G1 b1 F3000
    G90

[gcode_macro B_MINUS_1]
gcode:
    G91
    G1 b-1 F3000
    G90

[gcode_macro B_PLUS_10]
gcode:
    G91
    G1 b10 F3000
    G90

[gcode_macro B_MINUS_10]
gcode:
    G91
    G1 b-10 F3000
    G90


[gcode_macro VALVE_ON]
gcode:
    SET_PIN PIN=valve VALUE=1

[gcode_macro VALVE_OFF]
gcode:
    SET_PIN PIN=valve VALUE=0

[gcode_macro FAN1_ON]

gcode:
    SET_PIN PIN=f1 VALUE=1

[gcode_macro FAN1_OFF]

gcode:
    SET_PIN PIN=f1 VALUE=0

[gcode_macro PRINT_END_MESSAGE]
description: "Show total print duration at end of print"
gcode:
    RESPOND PREFIX="info" MSG="Print complete!"
    RESPOND PREFIX="info" MSG="Total print time: {printer.print_stats.print_duration} seconds"

